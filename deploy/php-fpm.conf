; /etc/php/8.3/fpm/pool.d/myclermont.conf
; Pool dédié à l'API

[myclermont]
user = www-data
group = www-data

listen = /run/php/php8.3-fpm-myclermont.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; "static" : les workers sont toujours prêts (pas de fork à la volée sous charge).
; Règle approximative : pm.max_children = RAM dédiée à PHP / ~30 Mo par worker.
pm = static
pm.max_children = 32
pm.max_requests = 10000

request_terminate_timeout = 20s
request_slowlog_timeout = 2s
slowlog = /var/log/php-fpm/myclermont-slow.log

; Variables d'environnement possibles ici au lieu du .env (elles priment sur .env)
; env[APP_ENV] = production

php_admin_value[error_log] = /var/log/php-fpm/myclermont-error.log
php_admin_flag[log_errors] = on
