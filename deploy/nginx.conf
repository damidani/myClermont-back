# /etc/nginx/sites-available/api.myclermont.fr
# Nginx + PHP-FPM (socket Unix). Adapter le chemin et le nom de domaine.

upstream myclermont_php {
    server unix:/run/php/php8.3-fpm-myclermont.sock;
    keepalive 16;
}

# Limite globale par IP (1re ligne de défense, avant même PHP)
limit_req_zone $binary_remote_addr zone=api_ip:10m rate=30r/s;

server {
    listen 80;
    server_name api.myclermont.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.myclermont.fr;

    root /var/www/myclermont/public;

    ssl_certificate     /etc/letsencrypt/live/api.myclermont.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.myclermont.fr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    gzip on;
    gzip_types application/json text/event-stream;
    gzip_min_length 1024;

    access_log /var/log/nginx/myclermont.access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/myclermont.error.log warn;

    # Back-office web : feuilles de style / scripts statiques
    location /admin-assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        location ~ \.php$ { deny all; }
    }

    # Back-office web (formulaires + envoi d'images 8 Mo). Pour le réserver à vos IP :
    #   allow 1.2.3.4; deny all;   (ou ADMIN_ALLOWED_IPS dans .env)
    location /admin {
        client_max_body_size 10m;
        limit_req zone=api_ip burst=30 nodelay;
        limit_req_status 429;
        fastcgi_pass myclermont_php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
    }

    # Tout passe par index.php : aucun autre fichier PHP n'est exécutable
    location / {
        limit_req zone=api_ip burst=60 nodelay;
        limit_req_status 429;

        fastcgi_pass myclermont_php;
        fastcgi_keep_conn on;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 15s;
    }

    # Médias publics (photos / vidéos de la communauté) : servis directement, sans PHP
    location /media/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        location ~ \.php$ { deny all; }
    }

    # Carte : flux progressif des repères (Server-Sent Events), sans mise en tampon
    location = /v1/places/pins/stream {
        fastcgi_pass myclermont_php;
        fastcgi_keep_conn on;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_buffering off;
        gzip off;
    }

    # Envoi de photos / vidéos
    location /v1/media {
        client_max_body_size 55m;
        limit_req zone=api_ip burst=10 nodelay;
        fastcgi_pass myclermont_php;
        fastcgi_keep_conn on;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
    }

    # Envoi de PDF (CV, lettres) : limite plus haute uniquement ici
    location /v1/documents {
        client_max_body_size 6m;
        limit_req zone=api_ip burst=10 nodelay;
        fastcgi_pass myclermont_php;
        fastcgi_keep_conn on;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 30s;
    }

    location ~ /\. {
        deny all;
    }
}
