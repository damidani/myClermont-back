; /etc/php/8.3/fpm/conf.d/99-myclermont.ini
; Réglages de performance et de sécurité pour l'API

; --- OPcache : le code PHP est compilé une fois et reste en mémoire -------------
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; En production les fichiers ne changent qu'au déploiement : pas de vérification disque
opcache.validate_timestamps=0
opcache.save_comments=0
; Préchargement de toutes les classes de l'application
opcache.preload=/var/www/myclermont/deploy/preload.php
opcache.preload_user=www-data
; JIT (gain modéré pour une API I/O-bound, mais gratuit)
opcache.jit=tracing
opcache.jit_buffer_size=64M

; --- Cache du chemin réel des fichiers ---------------------------------------------
realpath_cache_size=4096K
realpath_cache_ttl=600

; --- APCu : nonces, rate-limit, cache appareils -------------------------------------
apc.enabled=1
apc.shm_size=64M
apc.enable_cli=0

; --- Sécurité ---------------------------------------------------------------------
expose_php=Off
display_errors=Off
log_errors=On
allow_url_fopen=Off
session.auto_start=0
memory_limit=192M
max_execution_time=15
post_max_size=60M
upload_max_filesize=2M
