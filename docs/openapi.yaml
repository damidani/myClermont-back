        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      responses:
        '200': { description: OK — voir docs/API.md › Explorer }
        default: { description: Erreur, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /places/pins:
    get:
      tags: [Carte & lieux]
      summary: "Tous les repères (compact, du plus proche au plus loin)"
      security: [{ deviceSignature: [] }, { deviceSignature: [], bearer: [] }]
      parameters:
        - { name: near, in: query, schema: { type: string, example: '45.7773,3.0816' } }
        - { name: category, in: query, schema: { type: string } }
        - { name: filter, in: query, schema: { type: string, enum: [partners, must_see] } }
        - { name: If-None-Match, in: header, schema: { type: string } }
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceToken'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      responses:
        '200': { description: Repères + ETag }
        '304': { description: Rien n'a changé }
        default: { description: Erreur, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /places/pins/stream:
    get:
      tags: [Carte & lieux]
      summary: "Repères en flux SSE par anneaux de distance"
      security: [{ deviceSignature: [] }, { deviceSignature: [], bearer: [] }]
      parameters:
        - { name: near, in: query, schema: { type: string, example: '45.7773,3.0816' } }
        - { name: category, in: query, schema: { type: string } }
        - { name: filter, in: query, schema: { type: string, enum: [partners, must_see] } }
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceToken'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      responses:
        '200': { description: text/event-stream (meta, pins…, done) }
        default: { description: Erreur, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /places/nearby:
    get:
      tags: [Carte & lieux]
      summary: "Liste des lieux proches"
      security: [{ deviceSignature: [] }, { deviceSignature: [], bearer: [] }]
      parameters:
        - { name: near, in: query, schema: { type: string, example: '45.7773,3.0816' } }
        - { name: category, in: query, schema: { type: string } }
        - { name: filter, in: query, schema: { type: string, enum: [partners, must_see] } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceToken'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      responses:
        '200': { description: OK — voir docs/API.md › Carte & lieux }
        default: { description: Erreur, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /places/search:
    get:
      tags: [Carte & lieux]
      summary: "Recherche de lieux"
      security: [{ deviceSignature: [] }, { deviceSignature: [], bearer: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: near, in: query, schema: { type: string, example: '45.7773,3.0816' } }
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceToken'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      responses:
        '200': { description: OK — voir docs/API.md › Carte & lieux }
        default: { description: Erreur, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /places/{id}:
    get:
      tags: [Carte & lieux]
      summary: "Fiche lieu"
      security: [{ deviceSignature: [] }, { deviceSignature: [], bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: near, in: query, schema: { type: string, example: '45.7773,3.0816' } }
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceToken'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      responses:
        '200': { description: OK — voir docs/API.md › Carte & lieux }
        default: { description: Erreur, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /places/{id}/review:
    put:
      tags: [Carte & lieux]
      summary: "Donner mon avis"
      security: [{ deviceSignature: [], bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceToken'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [rating], properties: { rating: { type: integer, minimum: 1, maximum: 5 }, comment: { type: [string, 'null'] } } }
      responses:
        '200': { description: OK — voir docs/API.md › Carte & lieux }
        default: { description: Erreur, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

components:
  securitySchemes:
    deviceSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: HMAC-SHA256 avec le device_secret (+ X-Device-Id, X-Device-Token, X-Timestamp, X-Nonce)
    appSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: HMAC-SHA256 avec la clé application (+ X-Key-Id, X-Device-Id, X-Timestamp, X-Nonce)
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    KeyId:
      name: X-Key-Id
      in: header
      required: true
      schema: { type: string, example: ios-2026-1 }
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
    DeviceToken:
      name: X-Device-Token
      in: header
      required: true
      schema: { type: string, maxLength: 128 }
    Timestamp:
      name: X-Timestamp
      in: header
      required: true
      description: Secondes Unix UTC, tolérance ± 300 s
      schema: { type: integer }
    Nonce:
      name: X-Nonce
      in: header
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
    Signature:
      name: X-Signature
      in: header
      required: true
      schema: { type: string, pattern: '^[a-f0-9]{64}$' }

  schemas:
    Success:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: {}
        meta:
          type: object
          properties:
            rewards: { $ref: '#/components/schemas/Rewards' }

    Error:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: invalid_signature }
            message: { type: string }
            details:
              type: object
              additionalProperties: { type: string }

    Device:
      type: object
      properties:
        id: { type: string, format: uuid }
        platform: { type: string, enum: [ios, android] }
        model: { type: [string, 'null'] }
        os_version: { type: [string, 'null'] }
        app_version: { type: [string, 'null'] }
        push_enabled: { type: boolean }
        status: { type: string, enum: [active, blocked] }
        created_at: { type: string, format: date-time }

    DeviceRegistrationResponse:
      allOf:
        - $ref: '#/components/schemas/Success'
        - properties:
            data:
              type: object
              properties:
                device: { $ref: '#/components/schemas/Device' }
                device_token: { type: string }
                device_secret: { type: string, description: Transmis une seule fois - à stocker dans le Keychain / Keystore }
                server_time: { type: integer }
                signature_window: { type: integer, example: 300 }

    Username:
      type: string
      pattern: '^(?!\.)[A-Za-z0-9_.]{3,30}(?<!\.)$'
      example: lea_63

    Neighborhood:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }

    Badge:
      type: object
      properties:
        code: { type: string, enum: [welcome, curious, explorer, ambassador, volcano, gourmand] }
        name: { type: string }
        description: { type: string }
        earned_at: { type: [string, 'null'], format: date-time }

    User:
      type: object
      description: email, referral_code et premium_until uniquement sur le profil de l'utilisateur lui-même
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        bio: { type: [string, 'null'] }
        neighborhood: { oneOf: [{ $ref: '#/components/schemas/Neighborhood' }, { type: 'null' }] }
        points: { type: integer }
        is_premium: { type: boolean }
        badges: { type: array, items: { $ref: '#/components/schemas/Badge' } }
        created_at: { type: string, format: date-time }
        email: { type: string, format: email }
        referral_code: { type: string }
        premium_until: { type: [string, 'null'], format: date-time }

    EventCategory:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        icon: { type: string }
        color: { type: string, example: '#D63A5E' }
        count: { type: integer }

    Event:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        category: { $ref: '#/components/schemas/EventCategory' }
        image:
          type: [object, 'null']
          properties:
            url: { type: string, format: uri }
            caption: { type: [string, 'null'] }
        starts_at: { type: string, format: date-time, example: '2026-10-28T19:00:00+01:00' }
        ends_at: { type: string, format: date-time }
        duration_minutes: { type: integer }
        state: { type: string, enum: [upcoming, ongoing, past, cancelled] }
        venue:
          type: object
          properties:
            name: { type: string }
            city: { type: string }
            address: { type: [string, 'null'] }
            latitude: { type: [number, 'null'] }
            longitude: { type: [number, 'null'] }
        price:
          type: object
          properties:
            label: { type: [string, 'null'] }
            min_cents: { type: [integer, 'null'] }
            is_free: { type: boolean }
        source: { $ref: '#/components/schemas/Source' }
        external_url: { type: [string, 'null'] }
        is_featured: { type: boolean }
        participants_count: { type: integer }
        is_favorite: { type: [boolean, 'null'], description: null si non connecté }
        is_participating: { type: [boolean, 'null'], description: null si non connecté }

    EventDetail:
      allOf:
        - $ref: '#/components/schemas/Event'
        - properties:
            description: { type: [string, 'null'] }
            programme:
              type: array
              items:
                type: object
                properties:
                  time: { type: string, example: '18:00' }
                  label: { type: string }
            notice: { type: [string, 'null'] }
            ticket_url: { type: [string, 'null'] }
            capacity: { type: [integer, 'null'] }
            is_full: { type: boolean }
            share_url: { type: string, format: uri }
            calendar_url: { type: string }

    Source:
      type: [object, 'null']
      description: null = contenu publié par myClermont
      properties:
        slug: { type: string }
        kind: { type: string, enum: [partner, import] }
        name: { type: string }
        logo_url: { type: [string, 'null'] }
        attribution: { type: [string, 'null'] }

    Listing:
      type: object
      properties:
        id: { type: string, format: uuid }
        transaction: { type: object, properties: { code: { type: string, enum: [rent, sale, colocation] }, label: { type: string } } }
        property_type: { type: object, properties: { code: { type: string }, label: { type: string } } }
        title: { type: string }
        price:
          type: object
          properties:
            cents: { type: integer }
            period: { type: [string, 'null'], enum: [month, null] }
            label: { type: string, example: '690 € / mois' }
        location:
          type: object
          properties:
            district: { type: [string, 'null'] }
            city: { type: string }
            label: { type: string }
            neighborhood: { type: [object, 'null'] }
        surface_m2: { type: [number, 'null'] }
        rooms: { type: [integer, 'null'] }
        bedrooms: { type: [integer, 'null'] }
        furnished: { type: boolean }
        features:
          type: array
          items: { type: object, properties: { code: { type: string }, label: { type: string }, icon: { type: string } } }
        cover_url: { type: [string, 'null'] }
        image_count: { type: integer }
        source: { $ref: '#/components/schemas/Source' }
        is_favorite: { type: [boolean, 'null'] }
        published_at: { type: [string, 'null'], format: date-time }

    ListingDetail:
      allOf:
        - $ref: '#/components/schemas/Listing'
        - properties:
            images: { type: array, items: { type: string } }
            image_caption: { type: [string, 'null'] }
            description: { type: [string, 'null'] }
            charges: { type: [object, 'null'] }
            floor: { type: [integer, 'null'] }
            energy_class: { type: [string, 'null'] }
            available_from: { type: [string, 'null'], format: date }
            coordinates: { type: [object, 'null'] }
            income_hint:
              type: [object, 'null']
              properties:
                ratio: { type: integer }
                monthly_cents: { type: integer }
                label: { type: string }
                text: { type: string }
            notice: { type: [string, 'null'] }
            is_active: { type: boolean }
            contact:
              type: object
              properties:
                mode: { type: string, enum: [form, external, none] }
                url: { type: [string, 'null'] }
                label: { type: string }
            share_url: { type: string }

    Job:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        company: { type: object, properties: { name: { type: string }, logo_url: { type: [string, 'null'] } } }
        category: { type: object, properties: { slug: { type: string }, name: { type: string }, icon: { type: string } } }
        contract: { type: object, properties: { code: { type: string }, label: { type: string }, color: { type: string } } }
        work_mode: { type: object, properties: { code: { type: string }, label: { type: string }, icon: { type: string } } }
        summary: { type: [string, 'null'] }
        city: { type: string }
        salary:
          type: [object, 'null']
          properties:
            min_cents: { type: [integer, 'null'] }
            max_cents: { type: [integer, 'null'] }
            period: { type: [string, 'null'], enum: [year, month, hour, null] }
            label: { type: string, example: '38 000–45 000 € / an' }
        badge: { type: [string, 'null'] }
        is_new: { type: boolean }
        source: { $ref: '#/components/schemas/Source' }
        is_favorite: { type: [boolean, 'null'] }
        published_at: { type: [string, 'null'], format: date-time }

    JobDetail:
      allOf:
        - $ref: '#/components/schemas/Job'
        - properties:
            images: { type: array, items: { type: string } }
            image_caption: { type: [string, 'null'] }
            description: { type: [string, 'null'] }
            missions: { type: array, items: { type: string } }
            profile: { type: [string, 'null'] }
            start_date: { type: [string, 'null'], format: date }
            duration: { type: [string, 'null'] }
            notice: { type: [string, 'null'] }
            is_active: { type: boolean }
            apply:
              type: object
              properties:
                mode: { type: string, enum: [form, external, none] }
                url: { type: [string, 'null'] }
                label: { type: string }
                cv: { type: [string, 'null'], enum: [required, null] }
                cover_letter: { type: [string, 'null'], enum: [none, optional, required, null] }
            my_application:
              type: [object, 'null']
              properties:
                id: { type: string }
                status: { type: string, enum: [processing, sent] }
                applied_at: { type: string, format: date-time }
            share_url: { type: string }

    Rewards:
      type: array
      description: Points / badges gagnés pendant la requête (présent dans meta.rewards de n'importe quelle réponse)
      items:
        type: object
        properties:
          action: { type: string }
          points: { type: integer }
          badges: { type: array, items: { $ref: '#/components/schemas/Badge' } }

    Tokens:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, example: 900 }
        refresh_token: { type: string }
        refresh_expires_in: { type: integer, example: 2592000 }

    SessionResponse:
      allOf:
        - $ref: '#/components/schemas/Success'
        - properties:
            data:
              type: object
              properties:
                user: { $ref: '#/components/schemas/User' }
                tokens: { $ref: '#/components/schemas/Tokens' }

  responses:
    ParticipationState:
      description: État de la participation
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      is_participating: { type: boolean }
                      participants_count: { type: integer }
    FavoriteState:
      description: État du favori
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - properties:
                  data:
                    type: object
                    properties: { type: { type: string }, id: { type: string }, favorited: { type: boolean } }
    Unauthorized:
      description: Signature, appareil ou jeton invalide (voir error.code)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Appareil bloqué, compte désactivé ou plateforme incohérente
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Ressource déjà existante
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: Données invalides (error.details = champ → message)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Limite de débit atteinte
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
