openapi: 3.1.0
info:
  title: myClermont API
  version: 1.0.0
  description: |
    API des applications mobiles myClermont (iOS / Android).

    Toutes les routes sauf `/health` exigent une **signature HMAC-SHA256** (voir docs/SECURITE.md).
    Ces en-têtes ne peuvent pas être générés depuis Swagger UI : utiliser `php bin/console sign`.
servers:
  - url: https://api.myclermont.app/v1
    description: Production
  - url: http://127.0.0.1:8080/v1
    description: Développement local

tags:
  - name: Système
  - name: Appareils
  - name: Authentification
  - name: Utilisateurs
  - name: Gamification
  - name: Favoris
  - name: Premium
  - name: Agenda
  - name: Logement
  - name: Emploi
  - name: Documents
  - name: Communauté
  - name: Services
  - name: Mobilité
  - name: Petites annonces
  - name: Messagerie
  - name: Explorer
  - name: Carte & lieux

paths:
  /health:
    get:
      tags: [Système]
      summary: Disponibilité et heure serveur
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, example: ok }
                          server_time: { type: integer, example: 1793139600 }

  /devices/register:
    post:
      tags: [Appareils]
      summary: Enregistrer l'appareil (signé avec la clé application)
      security:
        - appSignature: []
      parameters:
        - $ref: '#/components/parameters/KeyId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform]
              properties:
                platform: { type: string, enum: [ios, android] }
                model: { type: [string, 'null'], maxLength: 100, example: 'iPhone15,2' }
                os_version: { type: [string, 'null'], maxLength: 50, example: '18.1' }
                app_version: { type: [string, 'null'], maxLength: 30, example: '1.4.0' }
                push_token: { type: [string, 'null'], maxLength: 255 }
      responses:
        '201':
          description: Appareil créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceRegistrationResponse' }
        '200':
          description: Appareil existant, identifiants renouvelés
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceRegistrationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /devices/me:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/DeviceToken'
      - $ref: '#/components/parameters/Timestamp'
      - $ref: '#/components/parameters/Nonce'
      - $ref: '#/components/parameters/Signature'
    get:
      tags: [Appareils]
      summary: Appareil courant
      security:
        - deviceSignature: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Appareils]
      summary: Mettre à jour l'appareil (push token, version...)
      security:
        - deviceSignature: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                model: { type: [string, 'null'], maxLength: 100 }
                os_version: { type: [string, 'null'], maxLength: 50 }
                app_version: { type: [string, 'null'], maxLength: 30 }
                push_token: { type: [string, 'null'], maxLength: 255 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/register:
    post:
      tags: [Authentification]
      summary: Créer un compte
      security:
        - deviceSignature: []
      parameters: &deviceHeaders
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceToken'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, username]
              properties:
                email: { type: string, format: email, maxLength: 191 }
                password: { type: string, minLength: 8, maxLength: 128, format: password }
                username: { $ref: '#/components/schemas/Username' }
                neighborhood_id: { type: [integer, 'null'] }
                referral_code: { type: [string, 'null'], maxLength: 8 }
      responses:
        '201':
          description: Compte créé, session ouverte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [Authentification]
      summary: Connexion
      security:
        - deviceSignature: []
      parameters: *deviceHeaders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Session ouverte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [Authentification]
      summary: Renouveler les jetons (le refresh token est à usage unique)
      security:
        - deviceSignature: []
      parameters: *deviceHeaders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: Nouvelle paire de jetons
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data: { $ref: '#/components/schemas/Tokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Authentification]
      summary: Déconnexion de cet appareil
      security:
        - deviceSignature: []
          bearer: []
      parameters: *deviceHeaders
      responses:
        '204': { description: Session fermée }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me:
    get:
      tags: [Utilisateurs]
      summary: Utilisateur connecté
      security:
        - deviceSignature: []
          bearer: []
      parameters: *deviceHeaders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Utilisateurs]
      summary: Modifier le profil
      security:
        - deviceSignature: []
          bearer: []
      parameters: *deviceHeaders
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { $ref: '#/components/schemas/Username' }
                bio: { type: [string, 'null'], maxLength: 500 }
                neighborhood_id: { type: [integer, 'null'] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /users/me/password:
    put:
      tags: [Utilisateurs]
      summary: Changer le mot de passe (ferme toutes les sessions, renvoie de nouveaux jetons)
      security: [{ deviceSignature: [], bearer: [] }]
      parameters: *deviceHeaders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, minLength: 8, maxLength: 128, format: password }
      responses:
        '200':
          description: Nouveaux jetons
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties: { data: { $ref: '#/components/schemas/Tokens' } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /users/{username}:
    get:
      tags: [Utilisateurs]
      summary: Profil public
      security: [{ deviceSignature: [] }]
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceToken'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties: { data: { $ref: '#/components/schemas/User' } }
        '404': { description: user_not_found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /users/username-available:
    get:
      tags: [Utilisateurs]
      summary: Disponibilité d'un pseudo
      security: [{ deviceSignature: [] }]
      parameters:
        - { name: username, in: query, required: true, schema: { $ref: '#/components/schemas/Username' } }
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceToken'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data:
                        type: object
                        properties: { username: { type: string }, available: { type: boolean } }

  /neighborhoods:
    get:
      tags: [Utilisateurs]
      summary: Quartiers de Clermont-Ferrand
      security: [{ deviceSignature: [] }]
      parameters: *deviceHeaders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/Neighborhood' } } }

  /badges:
    get:
      tags: [Gamification]
      summary: Catalogue des badges avec progression
      security: [{ deviceSignature: [], bearer: [] }]
      parameters: *deviceHeaders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/Badge'
                            - properties:
                                earned: { type: boolean }
                                points: { type: integer }
                                progress:
                                  type: object
                                  properties: { current: { type: integer }, target: { type: integer } }

  /users/me/points:
    get:
      tags: [Gamification]
      summary: Solde et historique des points
      security: [{ deviceSignature: [], bearer: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: before, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceToken'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data:
                        type: object
                        properties:
                          balance: { type: integer }
                          history:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: integer }
                                amount: { type: integer }
                                reason: { type: string }
                                created_at: { type: string, format: date-time }

  /users/me/favorites:
    get:
      tags: [Favoris]
      summary: Liste des favoris, ou filtre des ids en favori (paramètre ids)
      security: [{ deviceSignature: [], bearer: [] }]
      parameters:
        - { name: type, in: query, schema: { type: string, example: place } }
        - { name: ids, in: query, description: 'ids séparés par des virgules (200 max), requiert type', schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 30 } }
        - { name: before, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceToken'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            type: { type: string }
                            id: { type: string }
                            item: { type: [object, 'null'] }
                            created_at: { type: string, format: date-time }

  /users/me/favorites/{type}/{id}:
    parameters:
      - { name: type, in: path, required: true, schema: { type: string, example: place } }
      - { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/DeviceToken'
      - $ref: '#/components/parameters/Timestamp'
      - $ref: '#/components/parameters/Nonce'
      - $ref: '#/components/parameters/Signature'
    put:
      tags: [Favoris]
      summary: Ajouter aux favoris (idempotent)
      security: [{ deviceSignature: [], bearer: [] }]
      responses:
        '200': { $ref: '#/components/responses/FavoriteState' }
        '404': { description: favorite_target_not_found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Favoris]
      summary: Retirer des favoris (idempotent)
      security: [{ deviceSignature: [], bearer: [] }]
      responses:
        '200': { $ref: '#/components/responses/FavoriteState' }

  /users/me/premium:
    get:
      tags: [Premium]
      summary: Statut premium
      security: [{ deviceSignature: [], bearer: [] }]
      parameters: *deviceHeaders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data:
                        type: object
                        properties:
                          is_premium: { type: boolean }
                          until: { type: [string, 'null'], format: date-time }
                          source: { type: [string, 'null'] }
                          perks: { type: object, properties: { points_multiplier: { type: number } } }

  /events:
    get:
      tags: [Agenda]
      summary: Liste de l'agenda (événements à venir)
      security: [{ deviceSignature: [] }, { deviceSignature: [], bearer: [] }]
      parameters:
        - { name: category, in: query, schema: { type: string, example: sport } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: neighborhood_id, in: query, schema: { type: integer } }
        - { name: free, in: query, schema: { type: string, enum: ['1'] } }
        - { name: featured, in: query, schema: { type: string, enum: ['1'] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceToken'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/Event' } }
                  meta:
                    type: object
                    properties:
                      categories: { type: array, items: { $ref: '#/components/schemas/EventCategory' } }
                      total: { type: integer }
                      next_cursor: { type: [string, 'null'] }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /events/categories:
    get:
      tags: [Agenda]
      summary: Catégories avec nombre d'événements à venir
      security: [{ deviceSignature: [] }]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceToken'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/EventCategory' } } }

  /events/{id}:
    get:
      tags: [Agenda]
      summary: Fiche événement (id = UUID ou slug)
      security: [{ deviceSignature: [] }, { deviceSignature: [], bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceToken'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties: { data: { $ref: '#/components/schemas/EventDetail' } }
        '404': { description: event_not_found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /events/{id}/calendar.ics:
    get:
      tags: [Agenda]
      summary: Fichier iCalendar
      security: [{ deviceSignature: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceToken'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          description: Fichier .ics
          content:
            text/calendar:
              schema: { type: string }

  /events/{id}/participation:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/DeviceToken'
      - $ref: '#/components/parameters/Timestamp'
      - $ref: '#/components/parameters/Nonce'
      - $ref: '#/components/parameters/Signature'
    put:
      tags: [Agenda]
      summary: Je participe (idempotent, +5 points la première fois)
      security: [{ deviceSignature: [], bearer: [] }]
      responses:
        '200': { $ref: '#/components/responses/ParticipationState' }
        '404': { description: event_not_found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'event_cancelled, event_ended, event_full', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [Agenda]
      summary: Annuler la participation (idempotent)
      security: [{ deviceSignature: [], bearer: [] }]
      responses:
        '200': { $ref: '#/components/responses/ParticipationState' }

  /users/me/events:
    get:
      tags: [Agenda]
      summary: Événements auxquels je participe
      security: [{ deviceSignature: [], bearer: [] }]
      parameters:
        - { name: past, in: query, schema: { type: string, enum: ['1'] } }
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceToken'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/Event' } } }

  /housing:
    get:
      tags: [Logement]
      summary: Annonces (mode liste)
      security: [{ deviceSignature: [] }, { deviceSignature: [], bearer: [] }]
      parameters:
        - { name: transaction, in: query, schema: { type: string, enum: [rent, sale, colocation] } }
        - { name: furnished, in: query, schema: { type: string, enum: ['1'] } }
        - { name: max_price, in: query, description: euros, schema: { type: integer } }
        - { name: min_rooms, in: query, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string } }
        - { name: neighborhood_id, in: query, schema: { type: integer } }
        - { name: property_type, in: query, schema: { type: string } }
        - { name: bbox, in: query, description: 'minLat,minLng,maxLat,maxLng', schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [recent, price_asc, price_desc] } }
        - { name: limit, in: query, schema: { type: integer, maximum: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceToken'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/Listing' } }
                  meta:
                    type: object
                    properties:
                      transactions:
                        type: array
                        items: { type: object, properties: { code: { type: string }, label: { type: string }, count: { type: integer } } }
                      all_count: { type: integer }
                      total: { type: [integer, 'null'] }
                      next_cursor: { type: [string, 'null'] }

  /housing/map:
    get:
      tags: [Logement]
      summary: Épingles pour la vue carte
      security: [{ deviceSignature: [] }]
      parameters:
        - { name: transaction, in: query, schema: { type: string, enum: [rent, sale, colocation] } }
        - { name: furnished, in: query, schema: { type: string, enum: ['1'] } }
        - { name: max_price, in: query, description: euros, schema: { type: integer } }
        - { name: min_rooms, in: query, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string } }
