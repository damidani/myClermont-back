# Nginx du conteneur (dérivé de deploy/nginx.conf).
# Le conteneur écoute en HTTP sur le port 80 : le HTTPS est assuré devant lui
# (reverse proxy : Traefik, Caddy, Nginx de l'hôte, load balancer…).

upstream myclermont_php {
    server 127.0.0.1:9000;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=api_ip:10m rate=30r/s;

# IP réelle du client derrière le reverse proxy (réseaux privés Docker)
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80 default_server;
    server_name _;

    root /var/www/myclermont/public;


    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    gzip on;
    gzip_types application/json text/event-stream;
    gzip_min_length 1024;

    access_log /dev/stdout combined;
    error_log  /dev/stderr warn;

    # Back-office web : feuilles de style / scripts statiques
    location /admin-assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        location ~ \.php$ { deny all; }
    }

    # Back-office web (formulaires + envoi d'images 8 Mo). Pour le réserver à vos IP :
    #   allow 1.2.3.4; deny all;   (ou ADMIN_ALLOWED_IPS dans .env)
    location /admin {
        client_max_body_size 10m;
        limit_req zone=api_ip burst=30 nodelay;
        limit_req_status 429;
        fastcgi_pass myclermont_php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
    }

    # Tout passe par index.php : aucun autre fichier PHP n'est exécutable
    location / {
        limit_req zone=api_ip burst=60 nodelay;
        limit_req_status 429;

        fastcgi_pass myclermont_php;
        fastcgi_keep_conn on;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 15s;
    }

    # Médias publics (photos / vidéos de la communauté) : servis directement, sans PHP
    location /media/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        location ~ \.php$ { deny all; }
    }

    # Carte : flux progressif des repères (Server-Sent Events), sans mise en tampon
    location = /v1/places/pins/stream {
        fastcgi_pass myclermont_php;
        fastcgi_keep_conn on;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_buffering off;
        gzip off;
    }

    # Envoi de photos / vidéos
    location /v1/media {
        client_max_body_size 62m;
        limit_req zone=api_ip burst=10 nodelay;
        fastcgi_pass myclermont_php;
        fastcgi_keep_conn on;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
    }

    # Envoi direct d'un fichier sur l'URL signée (spec v1 › Envoi de fichiers)
    location ~ ^(/api)?/v1/uploads/[^/]+/blob$ {
        client_max_body_size 62m;
        limit_req zone=api_ip burst=10 nodelay;
        fastcgi_pass myclermont_php;
        fastcgi_keep_conn on;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
    }

    # Envoi de PDF (CV, lettres) : limite plus haute uniquement ici
    location /v1/documents {
        client_max_body_size 6m;
        limit_req zone=api_ip burst=10 nodelay;
        fastcgi_pass myclermont_php;
        fastcgi_keep_conn on;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 30s;
    }

    location ~ /\. {
        deny all;
    }
}
