; Pool PHP-FPM du conteneur (dérivé de deploy/php-fpm.conf)
[global]
error_log = /proc/self/fd/2
daemonize = no

[myclermont]
user = www-data
group = www-data
listen = 127.0.0.1:9000

; Ajustable sans reconstruire : PHP_FPM_MAX_CHILDREN dans docker-compose.yml (~30 Mo par worker)
pm = static
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.max_requests = 10000

request_terminate_timeout = 20s
catch_workers_output = yes
decorate_workers_output = no
; Les variables du conteneur (DB_HOST, APP_KEY…) sont transmises à PHP ; elles priment sur .env
clear_env = no

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
